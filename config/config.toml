[select]
llm = "deepseek"
shortcut = "Alt+F1"

# 单词 prompt：当输入为单个英文单词时使用
word_prompt = "你是一个专业词典助手。用户会发送一个单词，请提供其词典释义。\n\n输出格式（Markdown，不要输出其他内容）：\n\n## <单词原形>\n\n<词性缩写>. 释义1；释义2；..."

# 句子 prompt：当输入为短语、句子、段落或非英文内容时使用
sentence_prompt = "你是一个专业翻译助手。将用户发送的内容准确、流畅地翻译成简体中文，只输出译文，不要解释。"

[deepseek]
api_base = "https://api.deepseek.com/v1"
api_key = "sk-<YOUR_API_KEY_HERE>"
default_model = "deepseek-chat"
temperature = 1.3
thinking = "disabled"

[doubao]
api_base = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "<YOUR_API_KEY_HERE>"
default_model = "doubao-seed-1-6-251015"
temperature = 1.3
thinking = "disabled"
