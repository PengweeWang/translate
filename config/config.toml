[select]
llm = "deepseek"
prompt = "请将以下内容准确、流畅地翻译成简体中文：\n\n${text}"

[deepseek]
api_base = "https://api.deepseek.com/v1"  # API 基础地址
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # 替换为你的真实 API Key
default_model = "deepseek-chat"        # 默认使用的模型
temperature = 1.3                      # 生成随机性（0-2）